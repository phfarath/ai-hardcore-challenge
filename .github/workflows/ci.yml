name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pytest  # sem testes live (exigem chaves)

  # a imagem testada é a mesma que seria publicada: testes dentro do alvo `test` e smoke no
  # alvo `api`, com a tag do commit; o `docker stop` prova o desligamento por SIGTERM
  image:
    runs-on: ubuntu-latest
    needs: verify
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests inside the image
        run: |
          docker build --target test -t getnet-support-test:$TAG .
          docker run --rm getnet-support-test:$TAG
      - name: Build API image
        run: docker build --target api -t getnet-support-api:$TAG .
      - name: Smoke the built image
        run: |
          docker run -d --name api -p 8000:8000 -e OPENAI_API_KEY=sk-smoke -e OPENAI_CHAT_MODEL=smoke -e APP_ENV=development getnet-support-api:$TAG
          python scripts/smoke.py --base-url http://localhost:8000 --wait 60
      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 25 api
          docker logs api | grep '"event": "shutdown"'
