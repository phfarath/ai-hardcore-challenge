services:
  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_PATH: /data/chroma
      # demo local: emissor de tokens de desenvolvimento (POST /dev/token). Em produção, use
      # APP_ENV=production com AUTH_ISSUER e AUTH_JWKS_URL do provedor de identidade.
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${API_PORT:-8000}:8000"  # porta do host configurável (API_PORT)
    volumes:
      - chroma_data:/data/chroma

  # docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  chroma_data:
