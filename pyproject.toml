[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]  # prompts são prosa

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not live"'
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: testes que chamam serviços externos reais (OpenAI, Tavily, rede)"]
